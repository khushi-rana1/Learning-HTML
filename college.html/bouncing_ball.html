<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Ball</title>
  <style>
    .box{
        width: 100px;
        height: 100px;
        background-color: lightpink;
        border-radius: 50px;
        position: relative;
        animation: moveBox 1s infinite alternate
    }
    @keyframes moveBox{
        from { left: 0px;}
        to {
            left: 200px;
        }
    }
  </style>
</head>
<body style="width: 400px; ">
  <div class="box"></div>
</body>
</html>
