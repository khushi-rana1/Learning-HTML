<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color:yellow;
            width: 300px;
            height: 200px;
            position: relative;
        }
       .one{
            background-color:rgb(14, 53, 159);
            width: 90px;
            height: 80px;
            position: relative;
       }
       .two{
            background-color:rgb(14, 53, 159);
            width: 150px;
            height: 80px;
            position: absolute;
            left: 150px;
            top: 0px;
       }
       .three{

            background-color:rgb(14, 53, 159);
            width: 90px;
            height: 80px;
            position: absolute;
            bottom: 0px;
       }
       .four{
            background-color:rgb(14, 53, 159);
            width: 150px;
            height: 80px;
            position: absolute;
            left: 150px;
            bottom: 0px;
       }
    </style>
</head>
<body style="background-color: black;">
    <div class="box">
        <div class="one">  </div>
        <div class="two">  </div>
        <div class="three">  </div>
        <div class="four">  </div>
    </div>
    
</body>
</html>
