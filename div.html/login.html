<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
        }
        .body{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: wheat;
            height: 100vh;
        }
        .container{
            height: 400px;
            width: 500px;
            background-color: white;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 50px;
            padding-right: 50px;
        }
        h1{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            padding-bottom: 20px;
        }
        label{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 20px;
            margin-bottom: 5px;
            
        }
        input{
            width: 100%;
            height: 25px;
            border-radius: 4px;
            border: solid;
            padding: 10px;
        }
    </style>
</head>
<body class="body">
    <div class="container">
       <form>
       <h1>Login</h1>
       <div class="first">
        <label for="username" style="display: block;">Username</label>
        <input type="text" placeholder="Enter user name" style="display: block;">
       </div>

       <div class="second">
        <label for="password" style="display: block;">Password</label>
        <input type="password" placeholder="Enter password" style="display: block;">
       </div>

       <div class="button">

        <button class="submit">Submit</button>
       </div>
       </form>
    </div>
</body>
</html>
