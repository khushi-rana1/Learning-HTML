<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: white;
              width: 300px;
            height: 200px;
            position: relative;
        }
        .circle{
             background-color: red;
            border-radius: 100px;
            height: 100px;
            width: 100px;
            position: absolute;
            right: 100px;
            bottom: 50px;
        }
    </style>
</head>
<body style="background-color: black;">
    <div class="box">
        <div class="circle"></div>
        </div>
    
</body>
</html>
