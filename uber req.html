<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .req{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 100px;
        }
.pickup{
  display: block;
  background-color: rgb(240, 240, 240);
  border: none;
  margin-bottom: 10px;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 20px;
  padding-right: 20px;
  font-size: 16px;
  width: 400px;
}

.drop {
  display: block;
  background-color: rgb(240, 240, 240);
  border: none;
  margin-bottom: 10px;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 20px;
  padding-right: 20px;
  font-size: 16px;
  width: 400px;
  margin-bottom: 35px;
}

.yes {
  background-color: black;
  color: white;
  border: none;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 25px;
  padding-right: 25px;
  font-size: 16px;
  margin-right: 20px;
  cursor: pointer;
}

.later{
  background-color: rgb(240, 240, 240);
  border: none;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 25px;
  padding-right: 25px;
  font-size: 16px;
  cursor: pointer;
}
    </style>
</head>
<body>
    <p class="req">Request a ride now</p>
    <input class="pickup" type="text" placeholder="Enter pickup location">
    <input class="drop" type="text" placeholder="Enter destination">
    <button class="yes">Request now</button>
    <button class="later">Schedule for later</button>
</body>
</html>
