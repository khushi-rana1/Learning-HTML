<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
      .subscribe{
            background-color: rgb(200, 0, 0);
            color:white;
            border: 0cm;
            height: 36px;
            width:108px;
            border-radius:2px ;
            cursor: pointer;
            margin-right: 5px;
            transition: opacity,0.15s;
            }
            .subscribe:hover{
                opacity: 0.8;
            }
            .subscribe:active{
                opacity: 0.5;
            }

    .join{
        background-color: white;
        color: rgb(25, 25, 191);
        border-width: 1px;
        border-radius: 2.5px;
        border-style: solid;
        height: 36px;
        width: 62px;
        border-color: rgb(3, 79, 179);
        cursor: pointer;
        margin-right: 8px;
        transition: background-color,0.15s;
        transition: color,0.15s;
       }    
       .join:hover{
                background-color: rgb(3, 79, 179);
                color: white;
            }
        .join:active{
                opacity: 0.5;
            }
    .tweet{
        background-color: rgb(4, 126, 234);
        color: white;
        height: 36px;
        width: 75px;
        border: 0cm;
        border-radius: 50px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        transition: box-shadow 0.15s;
    }
     .tweet:hover{
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
            }  
    </style>
    </head>
    <body>
        <button class="subscribe">SUBSCRIBE</button>
        <button class="join">JOIN</button>
        <button class="tweet">Tweet</button>
    </body>
    </html>
