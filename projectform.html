<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill ouut the form below to register</p>
    <hr>
    <h2>Personal Details</h2>
    <form>
        <label for="name">First Name:</label>
        <input type="text" id="name" placeholder="eg:Arjun" required>
        <br>
        <br>

        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" placeholder="eg:Kumar">
        <br>
        <br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob">
        <br>

        <p>Gender:</p>
        <label for="Male">Male</label>
        <input type="radio" name="gender" id="Male" value="Male">
         <label for="Female">Female</label>
        <input type="radio"name="gender" id="Female" value="Female">
        <label for="other">other</label>
        <input type="radio"name="gender" id="other" value="other">
        <br><br>

        <label>Upload Your Photo:</label><br>
        <input type="file">
        <hr>
        <h2>Contact Information</h2>
     
            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="you@example.com">
            <br><br>
            <label for="phone">Phone number:</label>
            <input type="email" id="phone" placeholder="eg.9237002345">
            <br><br>

            <label for="add">Mailing Address:</label><br>
            <textarea id="add" rows="3"cols="11" placeholder="city, street address,state"></textarea>
            <hr>

            <h2>Academic Information</h2>

            <label for="cousre">Slect Your Course</label>
            <select name="course" id="course">
                <option value="CSE">CSE</option>
                 <option value="AIML">AIML</option>
                  <option value="Mechanical">Mechanical</option>
                   <option value="Civil">Civil</option>
                    <option value="Electrical">Eleactrical</option>
            </select>
            
            
            <h5>Extracurricular Intrests:</h5>
            <label for="sport">Sports</label>
            <input type="checkbox" id="sport" value="sport"><br>

             <label for="ma">Music & Arts</label>
            <input type="checkbox" id="ma" value="ma"><br>
        

             <label for="tec">technology Club</label>
            <input type="checkbox" id="tec" value="tec"><br>
        

             <label for="vol">Volunteering</label>
            <input type="checkbox" id="vol" value="vol"><br>
            <hr>

            <h1>Create Your Account</h1>
            <label for="password">Create a Password:</label>
            <input type="password" id="password"><br><br>

            <label for="secques">Security Question:</label>
            <select name="secques" id="secques">
                <option value="petname">What is your pet's name?</option>
                 <option value="hometown">Your Hometown?</option>
                  <option value="place">Your favourite place?</option>
            </select>
            
            <br><br>
            <label for="secans">Security Answer:</label>
            <input type="text" id="secans">
            <br><br>

            <label>I Agree to the Terms & Conditions</label>
            <input type="checkbox">
            <br><br>

            <hr>
            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>
        </form>
    </body>
</html>
